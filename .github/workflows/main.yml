name: Main

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # Use PR number if available, else the ref. Avoids `null`-keyed groups on push.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      # libzmq is built from source by `zeromq-src` (transitive of `zmq-sys`),
      # so no system libzmq install is needed on either OS. Windows uses MSVC
      # (preinstalled on `windows-latest`); Linux uses the host gcc.

      - name: cargo check
        run: cargo check --all-targets

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        # Integration tests bind hardcoded TCP ports; serializing avoids
        # collisions across test binaries.
        run: cargo test -- --test-threads=1

      - name: cargo doc
        run: cargo doc --no-deps
